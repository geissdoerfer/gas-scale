---
# Firewall setup/updates. Runs as the normal user + sudo (inventory.ini's
# default ansible_user), so it works whether or not root SSH login is still
# enabled - safe to re-run any time allowed_tcp_ports changes in
# group_vars/all.yml.
#
# Run as:
#   ansible-playbook firewall.yml
- name: Configure firewall
  hosts: server
  become: true
  gather_facts: true

  tasks:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true

    # Allow rules must be in place before the firewall is enabled, or the
    # SSH session used to run this playbook could be cut off.
    - name: Allow required TCP ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ allowed_tcp_ports }}"

    - name: Set default incoming policy to deny
      community.general.ufw:
        default: deny
        direction: incoming

    - name: Set default outgoing policy to allow
      community.general.ufw:
        default: allow
        direction: outgoing

    - name: Enable ufw
      community.general.ufw:
        state: enabled

    - name: Show ufw status
      ansible.builtin.command: ufw status verbose
      register: ufw_status
      changed_when: false

    - name: Print ufw status
      ansible.builtin.debug:
        var: ufw_status.stdout_lines
